name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_tag:
        description: Publish an existing release tag (e.g. v0.1.2) to PyPI, if its automatic publish failed
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  # Keeps a release PR open with the next version and changelog, derived from
  # Conventional Commit messages. Merging that PR tags the release.
  release-please:
    if: ${{ !inputs.publish_tag }}
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    # !cancelled(): still run when release-please was skipped for a manual publish.
    if: ${{ !cancelled() && (inputs.publish_tag || needs.release-please.outputs.release_created == 'true') }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      # PyPI trusted publishing: PyPI trusts this workflow via OIDC, so no
      # token is stored. The action also uploads provenance attestations.
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.publish_tag || needs.release-please.outputs.tag_name }}
      - uses: astral-sh/setup-uv@v6
      - run: uv run --locked pytest
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1
