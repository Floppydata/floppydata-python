name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  # Keeps a release PR open with the next version and changelog, derived from
  # Conventional Commit messages. Merging that PR tags the release.
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      # PyPI trusted publishing: PyPI trusts this workflow via OIDC, so no
      # token is stored. The action also uploads provenance attestations.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run --locked pytest
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1
