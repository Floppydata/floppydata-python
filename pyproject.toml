[project]
name = "floppydata"
version = "0.1.1"
description = "Python SDK for the Floppydata Client API v2: Web Data, rotating and static proxies, Cloud Browser."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.21.2",
  "pydantic>=1.9.2",
  "typing_extensions>=4.0.0",
]
keywords = ["floppydata", "proxy", "rotating-proxy", "web-data", "scraping", "cloud-browser", "sdk"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/Floppydata/floppydata-python"
Issues = "https://github.com/Floppydata/floppydata-python/issues"

[dependency-groups]
dev = [
  "mypy>=1.13",
  "playwright>=1.49",
  "pytest>=8",
  "ruff>=0.8",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/floppydata"]

[tool.ruff]
line-length = 100
target-version = "py310"
# Generated by scripts/generate.sh; fix the spec or fern/ config instead.
extend-exclude = ["src/floppydata"]

[tool.ruff.lint]
# Explicit, so new ruff releases do not change what CI enforces.
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
files = ["examples", "tests"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
